<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>VISC — Dashboard</title>
  <link rel="stylesheet" href="css/visc.css"/>
</head>
<body>
<nav class="topbar">
  <div class="topbar-brand">
    <div class="logo-circle">V</div>
    <span>VISC</span>
  </div>
  <div class="topbar-right">
    <span class="topbar-user" id="topUser"></span>
    <span class="topbar-empresa" id="topEmpresa" style="cursor:pointer;" title="Click para cambiar empresa" onclick="openEmpresaModal()">Sin empresa</span>
    <button class="btn-logout" onclick="doLogout()">Salir</button>
  </div>
</nav>

<div class="container">
  <!-- Cabecera -->
  <div class="page-header" style="margin-top:8px;">
    <div>
      <h1>Dashboard</h1>
      <p id="welcomeMsg">Bienvenido al sistema VISC</p>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="num" id="sObs">—</div><div class="lbl">Observaciones</div></div>
    <div class="stat-card"><div class="num" id="sVis">—</div><div class="lbl">Visitas</div></div>
    <div class="stat-card"><div class="num" id="sAsis">—</div><div class="lbl">Asistencias</div></div>
    <div class="stat-card"><div class="num" id="sInsp">—</div><div class="lbl">Inspecciones</div></div>
  </div>

  <!-- Módulos -->
  <div class="section-title">Módulos</div>
  <div class="modules-grid" id="modulesGrid"></div>
</div>

<!-- Modal selector empresa -->
<div id="empresaModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;">
  <div class="card" style="width:400px;margin:0;max-height:80vh;overflow-y:auto;">
    <div class="card-header">
      <span class="card-title">Seleccionar empresa activa</span>
      <button class="btn btn-ghost btn-sm" onclick="closeEmpresaModal()">✕</button>
    </div>
    <div id="empresaList" style="display:flex;flex-direction:column;gap:8px;"></div>
    <hr class="divider"/>
    <div id="crearEmpresaForm" class="hidden">
      <div class="section-title">Nueva empresa</div>
      <div class="form-group" style="margin-bottom:10px;"><label>RUN empresa</label><input id="newRun" placeholder="12345678-9"/></div>
      <div class="form-group" style="margin-bottom:14px;"><label>Razón Social</label><input id="newRazon" placeholder="Empresa S.A."/></div>
      <div class="btn-group">
        <button class="btn btn-primary btn-sm" onclick="crearEmpresa()">Crear</button>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('crearEmpresaForm').classList.add('hidden')">Cancelar</button>
      </div>
    </div>
    <button class="btn btn-secondary btn-sm mt-4" id="btnNuevaEmpresa" onclick="document.getElementById('crearEmpresaForm').classList.remove('hidden');this.classList.add('hidden')">+ Nueva empresa</button>
  </div>
</div>

<script src="js/api.js"></script>
<script>
const MODULOS = [
  { key:'observaciones',   href:'observaciones.html',   icon:'📋', name:'Observaciones',   desc:'Observaciones preventivas de seguridad' },
  { key:'visitas',         href:'visitas.html',         icon:'🏢', name:'Visitas',          desc:'Registros de visitas a terreno' },
  { key:'asistencia',      href:'asistencia.html',      icon:'📚', name:'Asistencias',      desc:'Capacitaciones y listas de participantes' },
  { key:'inspecciones',    href:'inspecciones.html',    icon:'🔍', name:'Inspecciones',     desc:'Inspecciones de seguridad con plantillas' },
  { key:'tiempo_dedicado', href:'tiempo_dedicado.html', icon:'⏱️', name:'Tiempo Dedicado',  desc:'Registro de horas por consultor' },
  { key:'usuarios',        href:'usuarios.html',         icon:'👤', name:'Mi cuenta',        desc:'Perfil, firma y gestión de usuarios' },
];

(async () => {
  const sess = requireAuth();
  if (!sess) return;

  document.getElementById('topUser').textContent = sess.nombre || sess.correo;
  document.getElementById('welcomeMsg').textContent = 'Bienvenido/a, ' + (sess.nombre || sess.correo);

  // Empresa activa
  await refreshEmpresaDisplay();

  // Módulos visibles
  const grid = document.getElementById('modulesGrid');
  MODULOS.forEach(m => {
    if (!tienePermiso(m.key, 'leer') && m.key !== 'usuarios') return;
    const a = document.createElement('a');
    a.className = 'module-card';
    a.href = m.href;
    a.innerHTML = `<div class="icon">${m.icon}</div><div class="name">${m.name}</div><div class="desc">${m.desc}</div>`;
    grid.appendChild(a);
  });

  // Estadísticas
  try {
    const r = await Empresas.estadisticas();
    if (r.success && r.stats) {
      document.getElementById('sObs').textContent  = r.stats.observaciones;
      document.getElementById('sVis').textContent  = r.stats.visitas;
      document.getElementById('sAsis').textContent = r.stats.asistencias;
      document.getElementById('sInsp').textContent = r.stats.inspecciones;
    }
  } catch(e) {}
})();

async function refreshEmpresaDisplay() {
  const r = await Empresas.activa().catch(() => ({ success: false }));
  if (r.success && r.empresa) {
    const label = r.empresa.run + ' — ' + r.empresa.razonSocial;
    document.getElementById('topEmpresa').textContent = label;
    localStorage.setItem('visc_empresa', JSON.stringify(r.empresa));
  } else {
    document.getElementById('topEmpresa').textContent = 'Sin empresa';
  }
}

async function openEmpresaModal() {
  document.getElementById('empresaModal').classList.remove('hidden');
  const sess = Auth.getSessionLocal();
  const list = document.getElementById('empresaList');
  list.innerHTML = '<p style="color:#888;font-size:13px;">Cargando…</p>';

  const r = await Empresas.listar().catch(() => ({ success: false, empresas: [] }));
  list.innerHTML = '';
  if (!r.success || !r.empresas.length) {
    list.innerHTML = '<p style="color:#888;font-size:13px;">No hay empresas registradas.</p>';
    return;
  }
  const empresaActiva = Empresas.getEmpresaLocal();
  r.empresas.forEach(emp => {
    const isActive = empresaActiva && empresaActiva.run === emp.run;
    const btn = document.createElement('button');
    btn.className = 'btn btn-secondary';
    btn.style.justifyContent = 'space-between';
    btn.innerHTML = `<span>${emp.run} — ${emp.razonSocial}</span>${isActive ? '<span>✓ Activa</span>' : ''}`;
    btn.onclick = async () => {
      await Empresas.seleccionar(emp.run);
      await refreshEmpresaDisplay();
      closeEmpresaModal();
      toast('Empresa seleccionada', 'success');
    };
    list.appendChild(btn);
  });

  // Solo SUPER_ADMIN puede crear empresas
  if (sess && sess.role === 'SUPER_ADMIN') {
    document.getElementById('btnNuevaEmpresa').classList.remove('hidden');
  } else {
    document.getElementById('btnNuevaEmpresa').classList.add('hidden');
  }
}

function closeEmpresaModal() {
  document.getElementById('empresaModal').classList.add('hidden');
  document.getElementById('crearEmpresaForm').classList.add('hidden');
  document.getElementById('btnNuevaEmpresa').classList.remove('hidden');
}

async function crearEmpresa() {
  const run   = document.getElementById('newRun').value.trim();
  const razon = document.getElementById('newRazon').value.trim();
  if (!run || !razon) { toast('RUN y Razón Social obligatorios', 'error'); return; }
  const r = await Empresas.crear(run, razon).catch(e => ({ success: false, message: e.message }));
  if (r.success) { toast('Empresa creada', 'success'); closeEmpresaModal(); openEmpresaModal(); }
  else toast(r.message || 'Error', 'error');
}

async function doLogout() {
  await Auth.logout();
  window.location.href = 'index.html';
}
</script>
</body>
</html>
