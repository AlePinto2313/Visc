<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>VISC — Tiempo Dedicado</title>
  <link rel="stylesheet" href="css/visc.css"/>
</head>
<body>
<nav class="topbar">
  <div class="topbar-brand">
    <div class="logo-circle">V</div>
    <a href="dashboard.html" style="color:#fff;font-weight:700;">← VISC</a>
  </div>
  <div class="topbar-right">
    <span class="topbar-user" id="topUser"></span>
    <button class="btn-logout" onclick="doLogout()">Salir</button>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <div><h1>⏱️ Tiempo Dedicado</h1><p>Registro de horas por consultor y proyecto</p></div>
    <button class="btn btn-primary" onclick="openNuevo()">+ Nuevo registro</button>
  </div>

  <!-- Lista de registros -->
  <div class="card">
    <div class="card-header"><span class="card-title">Mis registros</span></div>
    <div id="listaRegistros"><p style="color:#888;font-size:13px;">Cargando…</p></div>
  </div>

  <!-- Editor de registro -->
  <div id="editorCard" class="card hidden">
    <div class="card-header">
      <span class="card-title" id="editorTitle">Nuevo registro</span>
      <button class="btn btn-ghost btn-sm" onclick="cerrarEditor()">✕ Cerrar</button>
    </div>
    <div id="alertTD" class="alert alert-error hidden"></div>

    <div class="section-title">Datos del consultor</div>
    <div class="form-grid">
      <div class="form-group"><label>Nombre consultor</label><input id="tdNombre" placeholder="Juan Pérez"/></div>
      <div class="form-group"><label>RUT consultor</label><input id="tdRut" placeholder="12345678-9"/></div>
      <div class="form-group"><label>Cargo</label><input id="tdCargo" placeholder="Prevencionista"/></div>
      <div class="form-group"><label>Correo</label><input type="email" id="tdCorreo" placeholder="juan@visc.cl"/></div>
      <div class="form-group"><label>Proyecto / Área</label><input id="tdProyecto" placeholder="Empresa XYZ"/></div>
      <div class="form-group"><label>Fecha</label><input type="date" id="tdFecha"/></div>
      <div class="form-group full"><label>Observaciones</label><textarea id="tdObs" placeholder="Notas adicionales…"></textarea></div>
    </div>

    <div class="section-title">Detalle de tareas <span id="totalTiempo" style="color:var(--orange);font-size:14px;margin-left:8px;"></span></div>
    <div id="tareasList"></div>
    <button class="btn btn-secondary btn-sm" onclick="agregarTarea()">+ Tarea</button>

    <div class="mt-6 btn-group">
      <button class="btn btn-primary" id="btnGuardarTD" onclick="guardar()">💾 Guardar</button>
      <button class="btn btn-secondary" id="btnPDFTD" onclick="generarPDF()">📄 Generar PDF</button>
      <button class="btn btn-secondary" id="btnCorreoTD" onclick="enviarCorreo()">📧 Enviar correo</button>
    </div>

    <!-- Adjuntar archivo -->
    <div class="mt-4" style="border-top:1px solid var(--border);padding-top:16px;">
      <label style="font-size:12px;color:#888;">Adjuntar archivo adicional al correo (opcional)</label>
      <div style="display:flex;gap:10px;align-items:center;margin-top:6px;">
        <input type="file" id="adjunto" style="flex:1;font-size:12px;"/>
        <button class="btn btn-secondary btn-sm" onclick="enviarCorreoConAdjunto()">📎 Enviar con adjunto</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal nuevo registro -->
<div id="nuevoModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;">
  <div class="card" style="width:380px;margin:0;">
    <div class="card-header"><span class="card-title">Nuevo registro</span></div>
    <div class="form-group" style="margin-bottom:16px;"><label>Nombre del registro *</label><input id="nuevoNombre" placeholder="Enero 2025 — Empresa XYZ"/></div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="crearRegistro()">Crear</button>
      <button class="btn btn-ghost" onclick="document.getElementById('nuevoModal').classList.add('hidden')">Cancelar</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
let registroActual = null;
let tareas = [];

(async () => {
  const sess = requireAuth();
  if (!sess) return;
  document.getElementById('topUser').textContent = sess.nombre || sess.correo;
  document.getElementById('tdNombre').value = sess.nombre || '';
  document.getElementById('tdCorreo').value = sess.correo || '';
  document.getElementById('tdFecha').value  = new Date().toISOString().split('T')[0];
  await cargarLista();
})();

async function cargarLista() {
  const r = await TiempoDedicado.listar().catch(() => ({ success: false, items: [] }));
  const c = document.getElementById('listaRegistros');
  if (!r.success || !r.items.length) {
    c.innerHTML = '<div class="empty-state"><div class="icon">⏱️</div><p>No hay registros. Crea uno nuevo.</p></div>';
    return;
  }
  c.innerHTML = r.items.map(it => `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;">
      <div><strong style="font-size:13px;">${it.name}</strong></div>
      <div class="btn-group">
        <button class="btn btn-secondary btn-sm" onclick="abrirRegistro('${it.id}','${it.name}')">Editar</button>
        <a class="btn btn-ghost btn-sm" href="${it.url}" target="_blank">📊</a>
      </div>
    </div>
  `).join('');
}

async function abrirRegistro(sheetId, name) {
  registroActual = sheetId;
  document.getElementById('editorTitle').textContent = name;
  const r = await TiempoDedicado.obtener(sheetId).catch(() => ({ success: false }));
  if (r.success) {
    const res = r.resumen || {};
    document.getElementById('tdNombre').value  = res.nombre || '';
    document.getElementById('tdRut').value     = res.rut    || '';
    document.getElementById('tdCargo').value   = res.cargo  || '';
    document.getElementById('tdCorreo').value  = res.correo || '';
    document.getElementById('tdProyecto').value= res.proyecto || '';
    document.getElementById('tdFecha').value   = res.fecha  || new Date().toISOString().split('T')[0];
    document.getElementById('tdObs').value     = res.observaciones || '';
    tareas = (r.tareas || []).length ? r.tareas : [{ descripcion: '', tiempo: '' }];
  } else {
    tareas = [{ descripcion: '', tiempo: '' }];
  }
  renderTareas();
  document.getElementById('editorCard').classList.remove('hidden');
  document.getElementById('editorCard').scrollIntoView({ behavior: 'smooth' });
}

function cerrarEditor() {
  registroActual = null;
  document.getElementById('editorCard').classList.add('hidden');
}

function renderTareas() {
  const c = document.getElementById('tareasList');
  c.innerHTML = '';
  tareas.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'tarea-row';
    div.innerHTML = `
      <div class="form-group"><label>Descripción</label><input value="${t.descripcion||''}" oninput="tareas[${i}].descripcion=this.value" placeholder="Capacitación en EPP"/></div>
      <div class="form-group"><label>Tiempo (hh:mm)</label><input value="${t.tiempo||''}" oninput="tareas[${i}].tiempo=this.value;calcTotal()" placeholder="01:30"/></div>
      <button onclick="tareas.splice(${i},1);renderTareas();calcTotal()" style="background:#fee2e2;color:#991b1b;border:none;border-radius:6px;padding:8px 12px;cursor:pointer;align-self:flex-end;">✕</button>
    `;
    c.appendChild(div);
  });
  calcTotal();
}

function calcTotal() {
  let totalMin = 0;
  tareas.forEach(t => {
    const parts = (t.tiempo || '').split(':');
    if (parts.length === 2) totalMin += (parseInt(parts[0])||0)*60 + (parseInt(parts[1])||0);
  });
  const h = Math.floor(totalMin/60);
  const m = totalMin % 60;
  document.getElementById('totalTiempo').textContent = `Total: ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function agregarTarea() {
  tareas.push({ descripcion: '', tiempo: '' });
  renderTareas();
}

function getResumen() {
  return {
    nombre:       document.getElementById('tdNombre').value.trim(),
    rut:          document.getElementById('tdRut').value.trim(),
    cargo:        document.getElementById('tdCargo').value.trim(),
    correo:       document.getElementById('tdCorreo').value.trim(),
    proyecto:     document.getElementById('tdProyecto').value.trim(),
    fecha:        document.getElementById('tdFecha').value,
    observaciones: document.getElementById('tdObs').value.trim(),
  };
}

async function guardar() {
  if (!registroActual) { toast('Abre un registro primero', 'error'); return; }
  const btn = document.getElementById('btnGuardarTD');
  setLoading(btn, true);
  const r = await TiempoDedicado.guardar(registroActual, getResumen(), tareas).catch(e => ({ success: false, message: e.message }));
  if (r.success) toast('Guardado ✓', 'success');
  else toast(r.message || 'Error', 'error');
  setLoading(btn, false);
}

async function generarPDF() {
  if (!registroActual) { toast('Abre un registro primero', 'error'); return; }
  await guardar(); // guardar primero
  const btn = document.getElementById('btnPDFTD');
  setLoading(btn, true);
  const r = await TiempoDedicado.generarPDF(registroActual).catch(e => ({ success: false, message: e.message }));
  if (r.success && r.pdfUrl) window.open(r.pdfUrl, '_blank');
  else toast(r.message || 'Error', 'error');
  setLoading(btn, false);
}

async function enviarCorreo() {
  if (!registroActual) { toast('Abre un registro primero', 'error'); return; }
  await guardar();
  const btn = document.getElementById('btnCorreoTD');
  setLoading(btn, true);
  const r = await TiempoDedicado.enviarCorreo(registroActual).catch(e => ({ success: false, message: e.message }));
  if (r.success) toast('Correo enviado ✓', 'success');
  else toast(r.message || 'Error', 'error');
  setLoading(btn, false);
}

async function enviarCorreoConAdjunto() {
  if (!registroActual) { toast('Abre un registro primero', 'error'); return; }
  const file = document.getElementById('adjunto').files[0];
  if (!file) { toast('Selecciona un archivo primero', 'error'); return; }
  await guardar();
  const reader = new FileReader();
  reader.onload = async e => {
    const b64 = e.target.result.split(',')[1];
    const r = await TiempoDedicado.enviarCorreoConAdjunto(registroActual, { name: file.name, mimeType: file.type, bytesBase64: b64 })
      .catch(err => ({ success: false, message: err.message }));
    if (r.success) toast('Correo con adjunto enviado ✓', 'success');
    else toast(r.message || 'Error', 'error');
  };
  reader.readAsDataURL(file);
}

function openNuevo() { document.getElementById('nuevoNombre').value = ''; document.getElementById('nuevoModal').classList.remove('hidden'); }

async function crearRegistro() {
  const nombre = document.getElementById('nuevoNombre').value.trim();
  if (!nombre) { toast('Nombre obligatorio', 'error'); return; }
  const r = await TiempoDedicado.crear(nombre).catch(e => ({ success: false, message: e.message }));
  if (r.success) {
    document.getElementById('nuevoModal').classList.add('hidden');
    toast('Registro creado ✓', 'success');
    await cargarLista();
    await abrirRegistro(r.sheetId, nombre);
  } else {
    toast(r.message || 'Error', 'error');
  }
}

async function doLogout() { await Auth.logout(); window.location.href = 'index.html'; }
</script>
</body>
</html>
